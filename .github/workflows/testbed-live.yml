# Live checks against the testbed (ADR 0004: the dev laptop cannot run it).
# Manual only. Starts the testbed on the runner, runs one named check, uploads the evidence
# (run record + every Prometheus/Loki/Jaeger query and response + compose ps/logs), and always
# tears the testbed down.
name: Testbed live check

on:
  workflow_dispatch:
    inputs:
      scenario_id:
        description: "Check to run: baseline | deploy-check | 1-5 (scenarios, once implemented)"
        required: true
        default: baseline
        type: string
      duration_minutes:
        description: "Observation window in minutes (baseline), 1-30"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: testbed-live
  cancel-in-progress: false

jobs:
  live:
    name: "Live check: ${{ inputs.scenario_id }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCENARIO_ID: ${{ inputs.scenario_id }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
      TB_MIN_AVAILABLE_MB: "1024"
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          case "$SCENARIO_ID" in
            baseline|deploy-check) ;;
            1|2|3|4|5)
              echo "::error::Scenario $SCENARIO_ID is not implemented yet (Phase 2 T6-T8)."
              exit 1 ;;
            *)
              echo "::error::Unknown scenario_id '$SCENARIO_ID' (use baseline, deploy-check or 1-5)."
              exit 1 ;;
          esac
          if ! [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]] || (( DURATION_MINUTES < 1 || DURATION_MINUTES > 30 )); then
            echo "::error::duration_minutes must be a whole number from 1 to 30."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate testbed/.env with random secrets
        run: |
          testbed/tb.sh env
          if grep -q change-me testbed/.env; then echo "::error::placeholder secret left in .env"; exit 1; fi

      - name: Start the testbed
        run: make testbed-up

      - name: Wait until healthy
        run: |
          for _ in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8081/healthz >/dev/null && curl -fsS http://127.0.0.1:8089/healthz >/dev/null; then
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8081/healthz
          curl -fsS http://127.0.0.1:8089/healthz
          make testbed-status

      - name: Run the check (under the memory watchdog)
        working-directory: testbed
        run: |
          python3 -m harness.memguard watch --on-breach "make -C .. testbed-down" -- \
            python3 -m harness.live "$SCENARIO_ID" --minutes "$DURATION_MINUTES" --out runs

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p testbed/runs/diagnostics
          compose=(docker compose -f testbed/docker-compose.yml --env-file testbed/.env)
          "${compose[@]}" ps -a > testbed/runs/diagnostics/compose-ps.txt 2>&1 || true
          "${compose[@]}" logs --no-color --timestamps > testbed/runs/diagnostics/compose-logs.txt 2>&1 || true
          docker stats --no-stream > testbed/runs/diagnostics/docker-stats.txt 2>&1 || true
          free -m > testbed/runs/diagnostics/free.txt 2>&1 || true

      - name: Stop the testbed
        if: always()
        run: make testbed-down CLEAN=1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-live-${{ inputs.scenario_id }}-${{ github.run_id }}
          path: testbed/runs/
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          summary="testbed/runs/${SCENARIO_ID}/latest-summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Testbed live check \`${SCENARIO_ID}\`: no result"
              echo
              echo "The check did not complete. See the job log and the diagnostics in the artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
