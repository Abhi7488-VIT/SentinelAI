# Fault-injection scenario suite (Phase 2 T9). One runner per scenario: start the testbed, run the
# scenario twice with the same seed, require both runs `verified` and their symptom fingerprints
# equal within the stated tolerance (±1 onset bucket of 15 s, equal magnitude buckets). Uploads
# every run record and query output, and always tears the testbed down.
name: Testbed scenario suite

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario ids, comma-separated, or 'all'"
        required: true
        default: all
        type: string
      seed:
        description: "Seed for both runs"
        required: true
        default: "42"
        type: string
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC

permissions:
  contents: read

concurrency:
  group: testbed-scenarios
  cancel-in-progress: false

jobs:
  plan:
    name: Pick scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.pick.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          REQUESTED: ${{ inputs.scenarios || 'all' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          known = sorted(p.stem for p in pathlib.Path("testbed/scenarios").glob("*.json"))
          req = os.environ["REQUESTED"].strip()
          ids = known if req == "all" else [s.strip() for s in req.split(",") if s.strip()]
          unknown = sorted(set(ids) - set(known))
          if unknown or not ids:
              raise SystemExit(f"unknown scenario ids {unknown}; known: {known}")
          print("ids=" + json.dumps(ids))
          EOF

  scenario:
    name: "Scenario ${{ matrix.id }} (x2, same seed)"
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    env:
      SCENARIO_ID: ${{ matrix.id }}
      SEED: ${{ inputs.seed || '42' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate seed
        run: |
          if ! [[ "$SEED" =~ ^[0-9]{1,9}$ ]]; then echo "::error::seed must be a whole number"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate testbed/.env with random secrets
        run: |
          testbed/tb.sh env
          if grep -q change-me testbed/.env; then echo "::error::placeholder secret left in .env"; exit 1; fi

      - name: Start the testbed
        run: make testbed-up

      - name: Let the services settle
        run: sleep 60

      - name: Run twice with the same seed
        run: |
          set +e
          status=0
          for n in 1 2; do
            echo "::group::run $n"
            make scenario-run ID="$SCENARIO_ID" SEED="$SEED"
            rc=$?
            echo "::endgroup::"
            if (( rc != 0 )); then echo "::error::run $n of $SCENARIO_ID was not verified (exit $rc)"; status=1; fi
          done
          exit "$status"

      - name: Compare fingerprints
        run: |
          mapfile -t records < <(find "testbed/runs/$SCENARIO_ID" -maxdepth 1 -name '2*.json' -printf '%f\n' | sort)
          if (( ${#records[@]} < 2 )); then echo "::error::fewer than two run records"; exit 1; fi
          testbed/tb.sh scenario compare "/runs/$SCENARIO_ID/${records[-2]}" "/runs/$SCENARIO_ID/${records[-1]}" \
            | tee "testbed/runs/$SCENARIO_ID/fingerprint-compare.json"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p testbed/runs/diagnostics
          compose=(docker compose -f testbed/docker-compose.yml --env-file testbed/.env)
          "${compose[@]}" ps -a > testbed/runs/diagnostics/compose-ps.txt 2>&1 || true
          "${compose[@]}" logs --no-color --timestamps > testbed/runs/diagnostics/compose-logs.txt 2>&1 || true
          docker stats --no-stream > testbed/runs/diagnostics/docker-stats.txt 2>&1 || true
          free -m > testbed/runs/diagnostics/free.txt 2>&1 || true

      - name: Stop the testbed
        if: always()
        run: make testbed-down CLEAN=1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-scenario-${{ matrix.id }}-${{ github.run_id }}
          path: testbed/runs/
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Scenario \`$SCENARIO_ID\` (seed $SEED)"
            echo
            for f in $(find "testbed/runs/$SCENARIO_ID" -maxdepth 1 -name '2*.json' | sort); do
              python3 -c "import json,sys; r=json.load(open(sys.argv[1]))['run']; print(f\"- run \`{r['run_id']}\`: **{r['status']}** {'; '.join(r['reasons'])}\")" "$f"
            done
            if [[ -f "testbed/runs/$SCENARIO_ID/fingerprint-compare.json" ]]; then
              echo; echo '```json'; cat "testbed/runs/$SCENARIO_ID/fingerprint-compare.json"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
