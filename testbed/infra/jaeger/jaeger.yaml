# Jaeger v2 (built on the OTel Collector): OTLP in, in-memory storage capped at 2,000 traces (384 MiB container).
# Measured live (2026-11-17): 10,000 traces needed ~235 MiB under baseline traffic alone, and
# S1's report traces (~160 spans each) pushed it past the 256 MiB limit (restarts, traces lost).
# At 3,000 traces / 256 MiB it still restarted 3.5 min into S1 (+~30 MiB per 15 s under the fault).
# 2,000 traces is ~3 min of baseline traffic; the controller's trace checks read the newest 50.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: memstore
  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: 2000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
