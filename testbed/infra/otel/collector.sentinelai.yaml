# Overlay: also send every signal to SentinelAI's OTLP/HTTP ingest (Phase 3 T5).
# Loaded only when SENTINELAI_OTLP_ENDPOINT is set (collector command in docker-compose.yml; the
# network join is in docker-compose.sentinelai.yml). Pipelines are restated in full because list
# values replace on merge.
#
# SentinelAI ingest keys are per service (Phase 3 decision D1): the `routing` connectors send each
# service's telemetry to its own exporter, which authenticates with that service's key. Deployment
# events (emitted by `deploy-pipeline`) are routed by the service they deploy
# (`deployment.service.name` + `deployment.id`; the event name itself may arrive in the log record's
# `event_name` field rather than as an attribute). Anything unmatched is not sent to SentinelAI.
# Generated by hand from the five shop services; keep in sync with testbed/sentinelai-registry.json.

connectors:
  routing/traces:
    table:
      - context: resource
        condition: attributes["service.name"] == "frontend"
        pipelines: [traces/sai-frontend]
      - context: resource
        condition: attributes["service.name"] == "api-gateway"
        pipelines: [traces/sai-api-gateway]
      - context: resource
        condition: attributes["service.name"] == "user-service"
        pipelines: [traces/sai-user-service]
      - context: resource
        condition: attributes["service.name"] == "order-service"
        pipelines: [traces/sai-order-service]
      - context: resource
        condition: attributes["service.name"] == "payment-service"
        pipelines: [traces/sai-payment-service]
  routing/metrics:
    table:
      - context: resource
        condition: attributes["service.name"] == "frontend"
        pipelines: [metrics/sai-frontend]
      - context: resource
        condition: attributes["service.name"] == "api-gateway"
        pipelines: [metrics/sai-api-gateway]
      - context: resource
        condition: attributes["service.name"] == "user-service"
        pipelines: [metrics/sai-user-service]
      - context: resource
        condition: attributes["service.name"] == "order-service"
        pipelines: [metrics/sai-order-service]
      - context: resource
        condition: attributes["service.name"] == "payment-service"
        pipelines: [metrics/sai-payment-service]
  routing/logs:
    table:
      - context: resource
        condition: attributes["service.name"] == "frontend"
        pipelines: [logs/sai-frontend]
      - context: resource
        condition: attributes["service.name"] == "api-gateway"
        pipelines: [logs/sai-api-gateway]
      - context: resource
        condition: attributes["service.name"] == "user-service"
        pipelines: [logs/sai-user-service]
      - context: resource
        condition: attributes["service.name"] == "order-service"
        pipelines: [logs/sai-order-service]
      - context: resource
        condition: attributes["service.name"] == "payment-service"
        pipelines: [logs/sai-payment-service]
      - context: log
        condition: attributes["deployment.service.name"] == "frontend" and attributes["deployment.id"] != nil
        pipelines: [logs/sai-frontend]
      - context: log
        condition: attributes["deployment.service.name"] == "api-gateway" and attributes["deployment.id"] != nil
        pipelines: [logs/sai-api-gateway]
      - context: log
        condition: attributes["deployment.service.name"] == "user-service" and attributes["deployment.id"] != nil
        pipelines: [logs/sai-user-service]
      - context: log
        condition: attributes["deployment.service.name"] == "order-service" and attributes["deployment.id"] != nil
        pipelines: [logs/sai-order-service]
      - context: log
        condition: attributes["deployment.service.name"] == "payment-service" and attributes["deployment.id"] != nil
        pipelines: [logs/sai-payment-service]

exporters:
  otlphttp/sai-frontend:
    endpoint: ${env:SENTINELAI_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:SENTINELAI_KEY_FRONTEND}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    # Bounded in bytes so a SentinelAI outage cannot push the 192 MiB Collector into OOM.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 8388608
  otlphttp/sai-api-gateway:
    endpoint: ${env:SENTINELAI_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:SENTINELAI_KEY_API_GATEWAY}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    # Bounded in bytes so a SentinelAI outage cannot push the 192 MiB Collector into OOM.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 8388608
  otlphttp/sai-user-service:
    endpoint: ${env:SENTINELAI_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:SENTINELAI_KEY_USER_SERVICE}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    # Bounded in bytes so a SentinelAI outage cannot push the 192 MiB Collector into OOM.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 8388608
  otlphttp/sai-order-service:
    endpoint: ${env:SENTINELAI_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:SENTINELAI_KEY_ORDER_SERVICE}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    # Bounded in bytes so a SentinelAI outage cannot push the 192 MiB Collector into OOM.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 8388608
  otlphttp/sai-payment-service:
    endpoint: ${env:SENTINELAI_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:SENTINELAI_KEY_PAYMENT_SERVICE}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s
    # Bounded in bytes so a SentinelAI outage cannot push the 192 MiB Collector into OOM.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 8388608

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/jaeger, routing/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus, routing/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, routing/logs]
    traces/sai-frontend:
      receivers: [routing/traces]
      exporters: [otlphttp/sai-frontend]
    traces/sai-api-gateway:
      receivers: [routing/traces]
      exporters: [otlphttp/sai-api-gateway]
    traces/sai-user-service:
      receivers: [routing/traces]
      exporters: [otlphttp/sai-user-service]
    traces/sai-order-service:
      receivers: [routing/traces]
      exporters: [otlphttp/sai-order-service]
    traces/sai-payment-service:
      receivers: [routing/traces]
      exporters: [otlphttp/sai-payment-service]
    metrics/sai-frontend:
      receivers: [routing/metrics]
      exporters: [otlphttp/sai-frontend]
    metrics/sai-api-gateway:
      receivers: [routing/metrics]
      exporters: [otlphttp/sai-api-gateway]
    metrics/sai-user-service:
      receivers: [routing/metrics]
      exporters: [otlphttp/sai-user-service]
    metrics/sai-order-service:
      receivers: [routing/metrics]
      exporters: [otlphttp/sai-order-service]
    metrics/sai-payment-service:
      receivers: [routing/metrics]
      exporters: [otlphttp/sai-payment-service]
    logs/sai-frontend:
      receivers: [routing/logs]
      exporters: [otlphttp/sai-frontend]
    logs/sai-api-gateway:
      receivers: [routing/logs]
      exporters: [otlphttp/sai-api-gateway]
    logs/sai-user-service:
      receivers: [routing/logs]
      exporters: [otlphttp/sai-user-service]
    logs/sai-order-service:
      receivers: [routing/logs]
      exporters: [otlphttp/sai-order-service]
    logs/sai-payment-service:
      receivers: [routing/logs]
      exporters: [otlphttp/sai-payment-service]
