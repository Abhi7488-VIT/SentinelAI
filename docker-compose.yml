# SentinelAI local stack. Usage (from repo root, with .env created from .env.example):
#   docker compose up --build -d     # start everything; `docker compose ps` should show healthy
#   docker compose down              # stop (keep data)   |   docker compose down -v  # wipe data
# Published ports bind to 127.0.0.1 only.

name: sentinelai

x-backend-env: &backend-env
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:-sentinelai}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-sentinelai-api}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
  REFRESH_FAMILY_TTL_SECONDS: ${REFRESH_FAMILY_TTL_SECONDS:-2592000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-10}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  TELEMETRY_RETENTION_SPANS_DAYS: ${TELEMETRY_RETENTION_SPANS_DAYS:-3}
  TELEMETRY_RETENTION_LOGS_DAYS: ${TELEMETRY_RETENTION_LOGS_DAYS:-3}
  TELEMETRY_RETENTION_METRICS_DAYS: ${TELEMETRY_RETENTION_METRICS_DAYS:-7}

x-backend-build: &backend-build
  context: ./backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: *backend-build
    image: sentinelai-backend:dev
    # Migrations, then create today's (and upcoming) telemetry partitions before anything ingests.
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli.telemetry_maintenance && python -m app.cli.checkpoint_setup"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: sentinelai-backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # OTLP/HTTP receiver (Phase 3): same image, separate process so telemetry floods cannot starve
  # the API. Bounded by its memory limit and the ingest queue cap (429/503 with Retry-After).
  ingest:
    build: *backend-build
    image: sentinelai-backend:dev
    command: ["uvicorn", "app.ingest_main:create_ingest_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--no-server-header"]
    environment: *backend-env
    ports:
      - "127.0.0.1:8001:8001"
    # Also on the shared network the testbed's Collector joins (testbed/docker-compose.sentinelai.yml).
    networks:
      default: {}
      ingest:
        aliases: [sentinelai-ingest]
    mem_limit: 384m
    memswap_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    build: *backend-build
    image: sentinelai-backend:dev
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Investigation worker (Phase 4): consumes only the `investigations` queue with its own
  # concurrency, so a long investigation never delays a detection tick. Same image as `worker`.
  investigation-worker:
    build: *backend-build
    image: sentinelai-backend:dev
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "investigations", "-n", "investigations@%h", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d investigations@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Ingest writer (Phase 3): consumes only the `ingest` queue, so telemetry writes never delay
  # other background jobs. Idempotent; retries with backoff + jitter, then a capped dead-letter list.
  ingest-writer:
    build: *backend-build
    image: sentinelai-backend:dev
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "ingest", "-n", "ingest@%h", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d ingest@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Celery beat: periodic jobs (telemetry partition maintenance; Phase 3 adds detection ticks).
  beat:
    build: *backend-build
    image: sentinelai-backend:dev
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: sentinelai-frontend:dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

networks:
  default: {}
  # Created by this stack with a fixed name so the testbed can join it as an external network.
  ingest:
    name: sentinelai-ingest

volumes:
  pgdata:
  redisdata:
